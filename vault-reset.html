<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WakaBack Private Trips Reset</title>
<style>
:root{--bg:#eef1ec;--surface:#fff;--line:#d3dbd2;--fg:#14241c;--muted:#5b6b62;--accent:#1f6b47;--warn:#c2402a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1714;--surface:#16211c;--line:#2a3a32;--fg:#e6eee8;--muted:#97a89e;--accent:#4fbf86;--warn:#f07a62;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:32px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
h1{font-size:1.4rem;margin:0}h1 span{color:var(--accent)}
p{margin:0}.muted{color:var(--muted);font-size:.92rem}.ok{color:var(--accent);font-weight:600}.bad{color:var(--warn);font-weight:600}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>Waka<span>Back</span> Private trips</h1>
  <p id="msg">Checking your link…</p>
  <p class="muted" id="sub"></p>
</div></div>
<script src="premium-config.js"></script>
<script src="cloud.js"></script>
<script>
window.addEventListener("hashchange",()=>location.reload());
(async function(){
  const $=id=>document.getElementById(id);const h=new URLSearchParams((location.hash||"").slice(1));
  const u=h.get("u"),t=h.get("t"),a=h.get("a");
  const say=(m,cls,sub)=>{$("msg").textContent=m;$("msg").className=cls||"";$("sub").textContent=sub||"";};
  if(!u||!t){say("This link is incomplete.","bad","Open the link straight from the email.");return;}
  let cloud;try{cloud=window.WBCloud.create(window.WAKA_CONFIG||{});}catch(e){say("Connect to the internet and open the link again.","bad");return;}
  try{
    const r=await cloud.escrowLink(u,t,a==="cancel"?"cancel":"confirm");
    try{history.replaceState(null,"",location.pathname);}catch(e){}
    if(r.state==="cancelled")say("Reset cancelled.","ok","Your hidden trips stay locked with your current private password. If you didn't ask for the reset, change your WakaBack account password and your email password now.");
    else if(r.state==="ready")say("Your reset is ready.","ok","Open WakaBack → Trips → 🔒 Private → “Forgot private password?” to set a new private password.");
    else{const when=r.readyAt?new Date(r.readyAt).toLocaleString([],{weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit"}):"in 7 days";
      say("Reset confirmed.","ok","For your safety you can set a new private password from "+when+". Open WakaBack → Trips → 🔒 Private → “Forgot private password?” then. We've emailed you a warning with a link to cancel, in case this wasn't you.");}
  }catch(e){say("This link has expired or was already used.","bad","If you still need to reset, ask for a new link in WakaBack.");}
})();
</script>
</body>
</html>
